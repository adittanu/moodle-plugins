# =============================================
# Moodle Plugin Deploy Configuration
# =============================================
# Format: MOODLE_NAME|MOODLE_DIRROOT|MOODLE_WWWROOT
# 
# Add your Moodle instances below (one per line):
# MOODLE_NAME     = Nama identifier untuk instance
# MOODLE_DIRROOT  = Path ke folder root Moodle (tempat config.php)
# MOODLE_WWWROOT  = URL Moodle (untuk trigger upgrade via web)
# =============================================

# Contoh untuk local development:
moodle5|D:/Project/dali/moodle5/public|https://moodle5.test
moodle41|D:/Project/dali/moodle41|https://moodle41.test

# Contoh untuk server production:
# production|/var/www/moodle|https://lms.example.com
# staging|/var/www/moodle-staging|https://staging.example.com
